[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spoke-agent"
version = "0.1.0"
description = "Pro-Host-Agent: entdeckt lokale ML-Services (ollama/reranker/vision), registriert sie beim zentralen llm-router und bietet eine Admin-UI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jan Riener" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "websockets>=13",
    # OS-Keychain (optional, fallback auf .env). Reine Python-Pakete.
    "keyring>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# B008: FastAPI-Idiom (Depends(...) als Default).
# UP007: ``X | None`` ist py3.10+ — fuer 3.12 ok, aber nicht im Quellcode flagge.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
